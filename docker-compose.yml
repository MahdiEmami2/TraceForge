name: traceforge

services:
  # ---------------------------------------------------------------- apps ----
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: traceforge/app:1.0.0
    command: >
      uvicorn traceforge.gateway.main:create_gateway_app --factory
      --host 0.0.0.0 --port 8000
    environment:
      TF_ENVIRONMENT: development
      OTEL_SERVICE_NAME: gateway
      TF_PORT: "8000"
      TF_ORDER_URL: http://order-service:8000
      TF_OTEL_EXPORTER_PROTOCOL: http/protobuf
      TF_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
      TF_LATENCY_THRESHOLD_MS: "1000"
      TF_LOG_LEVEL: INFO
    ports:
      - "8080:8000"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  order-service:
    image: traceforge/app:1.0.0
    command: >
      uvicorn traceforge.orders.main:create_orders_app --factory
      --host 0.0.0.0 --port 8000
    environment:
      TF_ENVIRONMENT: development
      OTEL_SERVICE_NAME: order-service
      TF_PORT: "8000"
      TF_INVENTORY_URL: http://inventory-service:8000
      TF_OTEL_EXPORTER_PROTOCOL: http/protobuf
      TF_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
      TF_LATENCY_THRESHOLD_MS: "1000"
      TF_LOG_LEVEL: INFO
    # No host port published: order-service is intentionally only reachable
    # through the gateway or inside the compose network (realistic topology).
    depends_on:
      otel-collector:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  inventory-service:
    image: traceforge/app:1.0.0
    command: >
      uvicorn traceforge.inventory.main:create_inventory_app --factory
      --host 0.0.0.0 --port 8000
    environment:
      TF_ENVIRONMENT: development
      OTEL_SERVICE_NAME: inventory-service
      TF_PORT: "8000"
      TF_OTEL_EXPORTER_PROTOCOL: http/protobuf
      TF_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces
      TF_LATENCY_THRESHOLD_MS: "1000"
      TF_LOG_LEVEL: INFO
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------- telemetry ----
  otel-collector:
    image: otel/opentelemetry-collector:0.139.0
    container_name: traceforge-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health check
    healthcheck:
      test: ["CMD", "/otelcol", "--config=/etc/otelcol/config.yaml", "validate"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      tempo:
        condition: service_healthy
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    container_name: traceforge-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3200/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: traceforge-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.4
    container_name: traceforge-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:

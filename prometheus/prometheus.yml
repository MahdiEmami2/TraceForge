global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    deployment: traceforge-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: traceforge-apps
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - order-service:8000
          - inventory-service:8000
        labels:
          platform: traceforge

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]

apiVersion: 1

datasources:
  - name: Prometheus
    uid: traceforge-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      traceToMetrics:
        datasourceUid: traceforge-prom

  - name: Tempo
    uid: traceforge-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: traceforge-prom
      serviceMap:
        datasourceUid: traceforge-prom
